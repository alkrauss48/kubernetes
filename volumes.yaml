apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage
  namespace: resume-haus
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: do-block-storage
